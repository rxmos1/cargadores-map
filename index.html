<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Cargadores España</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div id="map"></div>

<header id="top">
  <nav id="nav"><a href="#mapa" id="n-mapa">Cargadores</a><a href="#coches" id="n-coches">Coches</a><a href="#guia" id="n-guia">Sabadell</a></nav>
</header>

<button id="fab" aria-label="Cerca de mí">◎<span>Cerca de mí</span></button>
<div id="boot">Cargando mapa…</div>

<section id="panel">
  <div id="grip" aria-label="Arrastra para ampliar"><i></i></div>
  <div class="search">
    <input id="q" placeholder="Buscar ciudad o dirección" autocomplete="off">
    <button id="go" aria-label="Buscar">⌕</button>
    <button id="locate" aria-label="Mi ubicación" title="Mi ubicación">◎</button>
  </div>
  <label class="sw"><span><b>Mis suscripciones</b><small id="swh">Precio con descuento</small></span><input id="member" type="checkbox" checked><i></i></label>
  <div class="chips" id="chips">
    <button data-t="" class="on">Todos</button><button data-t="DC">Rápidos</button><button data-t="AC">Lentos</button>
    <button data-t="150">+150 kW</button><button data-t="priced">Con precio</button>
  </div>
  <div class="stats">
    <div><b id="s-n">–</b><span>cargadores aquí</span></div>
    <div><b id="s-p">–</b><span>precio más bajo</span></div>
    <div><b id="s-t">–</b><span>tu carga</span></div>
  </div>
  <details class="car"><summary>Mi coche</summary>
    <div class="row3">
      <label>Batería kWh<input id="batt" type="number" value="60"></label>
      <label>De %<input id="from" type="number" value="10"></label>
      <label>A %<input id="to" type="number" value="80"></label>
    </div>
    
    <label>Límite AC (kW)<input id="acmax" type="number" value="11"></label>
  </details>
  <div id="status"></div>
  <div class="sort" id="sort"><button data-s="d" class="on">Más cerca</button><button data-s="p">Más barato</button><button data-s="k">Más potente</button></div>
  <ul id="list"></ul>
  <p class="foot" id="foot"></p>
</section>

<section id="card" hidden></section>
<iframe id="frame" hidden></iframe>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="this.onerror=null;document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js&quot;><\/script>')"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" onerror="this.onerror=null;document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js&quot;><\/script>')"></script>
<script src="app.js?v=9"></script>
</body>
</html>
